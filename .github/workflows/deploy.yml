name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Nightly rebuild so audio dropped into R2 folders appears without a code change.
  # R2 is listed at build time (see scripts/lib/r2-list.mjs); this re-lists + redeploys.
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily

# Prevent overlapping deploys; cancel superseded runs.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data bundle from YAML
        run: node scripts/build-bundle.mjs
        env:
          # R2 S3 credentials — build lists each dance's audio_prefix to generate
          # the recordings. Object-Read-only token scoped to the hyepar-audio bucket.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: hyepar-audio
          PUBLIC_AUDIO_BASE: ${{ vars.PUBLIC_AUDIO_BASE }}

      - name: Validate dance data (build-time guardrail)
        run: node scripts/validate-dances.mjs

      - name: Run tests
        run: npm test

      - name: Build site
        run: npx astro build
        env:
          # Audio base URL (r2.dev for now). Set as a repo variable so it can be
          # swapped to a custom domain without editing the workflow.
          PUBLIC_AUDIO_BASE: ${{ vars.PUBLIC_AUDIO_BASE }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name hyepar --branch main
