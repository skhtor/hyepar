name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Prevent overlapping deploys; cancel superseded runs.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data bundle from YAML
        run: node scripts/build-bundle.mjs

      - name: Validate dance data (build-time guardrail)
        run: node scripts/validate-dances.mjs

      - name: Run tests
        run: npm test

      - name: Build site
        run: npx astro build
        env:
          # Audio base URL (r2.dev for now). Set as a repo variable so it can be
          # swapped to a custom domain without editing the workflow.
          PUBLIC_AUDIO_BASE: ${{ vars.PUBLIC_AUDIO_BASE }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name hyepar --branch main
